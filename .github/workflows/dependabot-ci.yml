name: Dependabot CI for Golang

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'  # Change this if using a different Go version

      - name: Verify Go Modules
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v ./...